# Копия того, что реально работает на проде: /etc/nginx/sites-enabled/navalivay.
#
# Файл лежит здесь для чтения и сверки, автоматически он никуда не уезжает:
# валидатор деплоя инфраструктуру не выкладывает, конфиг меняют на сервере
# руками, а потом обновляют эту копию. Если версии разъедутся — прав сервер.
#
# Прошлая версия этого файла запрещала кэширование вообще всего, включая
# картинки, и расходилась с сервером на сотню строк: там были и rate limiting,
# и WebSocket-map, которых на проде нет. Накат такой копии поверх рабочего
# конфига сломал бы отдачу картинок.
#
# Отдельно про кэш. Картинки под /uploads/ названы по хэшу содержимого:
# поменялась картинка — поменялось имя файла. Поэтому им отдаётся expires 30d
# и immutable, и браузер не перекачивает их на каждый заход. Выключить кэш
# здесь ради «свежести» — значит вернуть мегабайты трафика на каждое открытие
# каталога, ради избавления от которых хэш в имени и заводили.

server {
    server_name navalivay.store www.navalivay.store;

    root /var/www/NAVALIVAY/frontend/dist;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Uploads - ДОЛЖЕН БЫТЬ ПЕРВЫМ с ^~ для приоритета над regex
    location ^~ /uploads/ {
        alias /var/www/NAVALIVAY/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    # API proxy
    location /api {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Static files caching (только для dist, не для uploads)
    location ~* ^(?!/uploads/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    # index.html — всегда свежий (Telegram WebView кеширует агрессивно)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    # Frontend - должен быть последним
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        # SPA fallback тоже не кешируем
        if ($uri = /index.html) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/navalivay.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/navalivay.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    if ($host = www.navalivay.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = navalivay.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name navalivay.store www.navalivay.store;
    return 404; # managed by Certbot
}
