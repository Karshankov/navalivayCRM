<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Сайт работает только как Telegram Mini App и не должен попадать в поиск. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta
      name="yandex"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta
      name="googlebot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />

    <!-- NO CACHE -->
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" href="/logo-navalivay.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-navalivay.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Preview metadata for links shared outside search engines -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="НАВАЛИВАЙ - все для вейпинга" />
    <meta
      property="og:description"
      content="Широкий ассортимент товаров для вейпинга с быстрой доставкой"
    />
    <meta property="og:image" content="/logo-navalivay.png" />

    <!-- Google Fonts - Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Telegram WebApp optimization -->
    <meta name="theme-color" content="#DC2626" />
    <meta name="version" content="1762247956" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <script src="/clear-cache.js"></script>
    <title>НАВАЛИВАЙ - все для вейпинга</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
