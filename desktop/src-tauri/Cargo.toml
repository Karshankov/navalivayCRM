[package]
name = "crm-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP-сервер внутри приложения: раздаёт собранный фронтенд и проксирует /api
# на бэкенд. Именно он избавляет от правок в 320 относительных путях фронта.
#
# hyper, а не tiny_http: SSE-поток (`/api/admin/crm/events`) должен доходить до
# окна сразу после события. tiny_http оборачивает ответ в chunked-кодировщик,
# который копит байты до заполнения чанка, — события приходили пачками с
# задержкой, а живой канбан и уведомления на этом и держатся. hyper отдаёт
# поток по мере поступления, поэтому берём его.
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
# Клиент для проксирования: неблокирующий, чтобы поток SSE не занимал поток
# исполнения целиком, как это делал blocking-вариант.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# Тело проксируемых запросов и ответов передаётся между клиентом и сервером
# как поток байт, без накопления в памяти.
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
